name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldops-backend/backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops
          POSTGRES_DB: fieldops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: fieldops
      DB_PASSWORD: fieldops
      DB_NAME: fieldops
      DB_SYNCHRONIZE: "false"
      DB_RUN_MIGRATIONS: "true"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnop
      JWT_MFA_SECRET: ci-mfa-secret-0123456789abcdefghijklmnopqrs
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: fieldops-proofs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      THROTTLE_LIMIT: "10000"
      # V3 : le test de bout en bout reçoit les webhooks sur 127.0.0.1 (hors production : autorisé)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fieldops-backend/backend/package-lock.json
      - run: npm ci
      - name: Vérification des types
        run: npm run lint
      - name: Tests unitaires
        run: npm test -- --ci
      - name: Build
        run: npm run build
      - name: MinIO (stockage des preuves)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Migrations + données de démo
        run: |
          npm run migration:run
          npm run seed
      - name: Migrations à jour avec les entités
        run: |
          npm run typeorm -- migration:generate src/database/migrations/Check --check
      - name: Test de bout en bout
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health && break; sleep 1; done
          npm run test:smoke
      - name: Logs API en cas d'échec
        if: failure()
        run: cat api.log || true


  web:
    name: Console web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldops-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fieldops-web/package-lock.json
      - run: npm ci
      - name: Types des routes (LayoutProps…)
        run: npx next typegen
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Build de production
        run: npx next build

  mobile:
    name: Application mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldops-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fieldops-mobile/package-lock.json
      - run: npm ci
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint

  docker:
    needs: [backend, web, mobile]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: fieldops-backend/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fieldops-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/fieldops-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
