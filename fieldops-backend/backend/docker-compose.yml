# Environnement complet de développement / démo.
#   docker compose up -d --build
#   docker compose exec api npm run seed:prod
# API : http://localhost:3000/api/v1 · Swagger : http://localhost:3000/api/docs
# MinIO : http://localhost:9001 (minioadmin/minioadmin) · Mailpit : http://localhost:8025
name: fieldops

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
      POSTGRES_DB: fieldops
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio sur Docker Hub refuse le pull (accès restreint côté registre) ;
    # quay.io est le registre miroir officiel de MinIO Inc.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fieldops
      DB_PASSWORD: fieldops
      DB_NAME: fieldops
      DB_SYNCHRONIZE: "false"
      DB_RUN_MIGRATIONS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-0123456789
      JWT_MFA_SECRET: dev-only-mfa-secret-change-me-0123456789abc
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-3
      S3_BUCKET: fieldops-proofs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      PUSH_PROVIDER: log
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMS_PROVIDER: log
      SWAGGER_ENABLED: "true"

volumes:
  pgdata:
  redisdata:
  miniodata:
